<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uiqm | games hub</title>
    <link rel="icon" href="/assets/img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="/gmt/index.js"></script>
    <script>
        window._proxyReady = (async () => {
            const clearDB = (name) => new Promise(res => {
                const r = indexedDB.deleteDatabase(name);
                r.onsuccess = r.onerror = r.onblocked = () => res();
            });
            try {
                await clearDB('__sj'); await clearDB('sj');
            } catch (_) {}
            await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = '/worker/working.all.js';
                s.onload = resolve;
                s.onerror = () => reject(new Error('Failed to load proxy engine'));
                document.head.appendChild(s);
            });
        })();
    </script>
    <style>
        :root {
            --glow: #ff0000;
            --bg: #050505;
            --card-bg: #0f0f0f;
            --text: #ffffff;
            --sub-text: #888888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::-webkit-scrollbar { width: 8px; }
        body::-webkit-scrollbar-track { background: #000; }
        body::-webkit-scrollbar-thumb { background: var(--glow); border-radius: 10px; }

        .header-bar {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border-bottom: 1px solid #111;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--glow);
        }
        .search-box {
            flex: 1;
            max-width: 500px;
            margin: 0 30px;
        }
        #search-input {
            width: 100%;
            padding: 12px 20px;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
        .nav-actions { display: flex; gap: 10px; }
        .nav-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--glow);
            color: var(--glow);
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .nav-btn:hover { background: var(--glow); color: #fff; }

        .container { padding: 40px 5%; }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--glow); }
        .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .card-content { padding: 15px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: var(--glow); }
        .card-desc { font-size: 13px; color: var(--sub-text); line-height: 1.4; height: 3.8em; overflow: hidden; }
        
        #proxy-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; }
        #proxy-frame { width: 100%; height: 100%; border: none; }
        .overlay-tools { position: fixed; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 1001; }
        .tool-btn { background: rgba(0,0,0,0.8); border: 1px solid #fff; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        #settings-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0a0a; padding: 25px; border-radius: 15px; border: 1px solid var(--glow); z-index: 2000; display: none; width: 90%; max-width: 450px; max-height: 80vh; overflow-y: auto; }
        .settings-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--glow); text-transform: uppercase; }
        .color-options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .color-swatch { aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-swatch.active { border-color: #fff; }
        
        .cloak-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .cloak-box { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; background: #111; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .cloak-box:hover { background: #1a1a1a; border-color: var(--glow); }
        .cloak-box img { width: 24px; height: 24px; }
        .cloak-box span { font-size: 9px; color: #888; text-align: center; }

        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1s; }
        body[data-theme="hacker"] #matrix-canvas { opacity: 0.2; }
    </style>
</head>
<body>

        </div>

        <div class="cloak-grid">

            <div class="cloak-box" onclick="applyCloak('Google', 'https://www.google.com/favicon.ico')"><img src="https://www.google.com/favicon.ico"><span>Google</span></div>
            <div class="cloak-box" onclick="applyCloak('Google Drive', 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png')"><img src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"><span>Drive</span></div>
            <div class="cloak-box" onclick="applyCloak('Google Classroom', 'https://ssl.gstatic.com/classroom/favicon.png')"><img src="https://ssl.gstatic.com/classroom/favicon.png"><span>Classroom</span></div>
            <div class="cloak-box" onclick="applyCloak('Schoology', 'https://asset-cdn.schoology.com/sites/all/themes/schoology_theme/favicon.ico')"><img src="https://asset-cdn.schoology.com/sites/all/themes/schoology_theme/favicon.ico"><span>Schoology</span></div>
            <div class="cloak-box" onclick="applyCloak('Khan Academy', 'https://www.khanacademy.org/favicon.ico')"><img src="https://www.khanacademy.org/favicon.ico"><span>Khan</span></div>
            <div class="cloak-box" onclick="applyCloak('Canva', 'https://www.canva.com/favicon.ico')"><img src="https://www.canva.com/favicon.ico"><span>Canva</span></div>
            <div class="cloak-box" onclick="applyCloak('Kahoot!', 'https://kahoot.it/favicon.ico')"><img src="https://kahoot.it/favicon.ico"><span>Kahoot</span></div>
            <div class="cloak-box" onclick="applyCloak('Blooket', 'https://www.blooket.com/favicon.ico')"><img src="https://www.blooket.com/favicon.ico"><span>Blooket</span></div>
            <div class="cloak-box" onclick="applyCloak('Gimkit', 'https://www.gimkit.com/favicon.ico')"><img src="https://www.gimkit.com/favicon.ico"><span>Gimkit</span></div>

            <div class="cloak-box" onclick="applyCloak('OneDrive', 'https://onedrive.live.com/favicon.ico')"><img src="https://onedrive.live.com/favicon.ico"><span>OneDrive</span></div>
            <div class="cloak-box" onclick="applyCloak('Word', 'https://static2.sharepointonline.com/files/fabric/assets/brand-icons/product/svg/word_32x1.svg')"><img src="https://static2.sharepointonline.com/files/fabric/assets/brand-icons/product/svg/word_32x1.svg"><span>Word</span></div>
            <div class="cloak-box" onclick="applyCloak('Excel', 'https://static2.sharepointonline.com/files/fabric/assets/brand-icons/product/svg/excel_32x1.svg')"><img src="https://static2.sharepointonline.com/files/fabric/assets/brand-icons/product/svg/excel_32x1.svg"><span>Excel</span></div>

            <div class="cloak-box" onclick="applyCloak('Canvas', 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e1066510a1.ico')"><img src="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e1066510a1.ico"><span>Canvas</span></div>
            <div class="cloak-box" onclick="applyCloak('Bing', 'https://www.bing.com/sa/simg/favicon-2x.ico')"><img src="https://www.bing.com/sa/simg/favicon-2x.ico"><span>Bing</span></div>

        <button class="btn" style="margin-top: 30px; width: 100%; justify-content: center;" onclick="closeSettings()">CLOSE</button>
    </div>

    <canvas id="matrix-canvas"></canvas>

    <script src="/assets/js/data.js"></script>
    <script>
        function initMatrix() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = "0101010101010101";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }
        initMatrix();

        let sjEncode = null;
        const grid = document.getElementById('games-grid');
        const search = document.getElementById('search-input');
        const overlay = document.getElementById('proxy-overlay');
        const frame = document.getElementById('proxy-frame');

        const SCRAMJET_PREFIX = '/scram/network/';

        const initProxy = async () => {
            try {
                if ('serviceWorker' in navigator) {
                    await navigator.serviceWorker.register('/scram/scramjet.sw.js', { scope: '/scram/' });
                    const script = document.createElement('script');
                    script.src = '/scram/scramjet.all.js';
                    document.head.appendChild(script);
                    script.onload = () => { sjEncode = url => SCRAMJET_PREFIX + encodeURIComponent(url); };
                }
            } catch (e) { console.error(e); }
        };

        const renderGames = (filter = '') => {
            grid.innerHTML = '';
            const filtered = games.filter(g => g.title.toLowerCase().includes(filter.toLowerCase()));
            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.image}" class="card-img" alt="${game.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${game.title}</div>
                        <div class="card-desc">${game.desc}</div>
                        <button class="launch-btn" onclick="launchGame('${game.url}')">Launch Game</button>
                    </div>
                `;
                card.onclick = (e) => { if(!e.target.classList.contains('launch-btn')) launchGame(game.url); };
                grid.appendChild(card);
            });
        };

        window.launchGame = (url) => { overlay.style.display = 'block'; frame.src = sjEncode ? sjEncode(url) : (SCRAMJET_PREFIX + encodeURIComponent(url)); };
        window.closeGame = () => { overlay.style.display = 'none'; frame.src = 'about:blank'; };
        window.toggleFullscreen = () => { if (!document.fullscreenElement) overlay.requestFullscreen(); else document.exitFullscreen(); };
        window.openSettings = () => document.getElementById('settings-modal').style.display = 'block';
        window.closeSettings = () => document.getElementById('settings-modal').style.display = 'none';

        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.onclick = () => {
                const color = swatch.dataset.color;
                if (color === 'hacker') { document.body.setAttribute('data-theme', 'hacker'); } 
                else { document.body.removeAttribute('data-theme'); document.documentElement.style.setProperty('--glow', color); }
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                localStorage.setItem('hub-color', color);
            };
        });

        const savedColor = localStorage.getItem('hub-color');
        if (savedColor) {
            if (savedColor === 'hacker') document.body.setAttribute('data-theme', 'hacker');
            else document.documentElement.style.setProperty('--glow', savedColor);
        }

        window.applyCloak = (title, icon) => {
            document.title = title;
            let link = document.querySelector("link[rel~='icon']");
            if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
            link.href = icon;
            sessionStorage.setItem('term-cloak-title', title);
            sessionStorage.setItem('term-cloak-icon', icon);
        };

        window.resetCloak = () => {
            const title = 'uiqm web proxy | private terminal';
            const icon = '/assets/img/logo.png';
            document.title = title;
            let link = document.querySelector("link[rel~='icon']");
            if (link) link.href = icon;
            sessionStorage.setItem('term-cloak-title', title);
            sessionStorage.setItem('term-cloak-icon', icon);
        };

        const restoreCloak = () => {
            const savedTitle = sessionStorage.getItem('term-cloak-title') || 'uiqm web proxy | private terminal';
            const savedIcon = sessionStorage.getItem('term-cloak-icon') || '/assets/img/logo.png';
            document.title = savedTitle;
            let link = document.querySelector("link[rel~='icon']");
            if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
            link.href = savedIcon;
        };

        restoreCloak();
        search.oninput = () => renderGames(search.value);
        renderGames();
        initProxy();
    </script>
    <script src="/assets/js/core.js"></script>
</body>
</html>
