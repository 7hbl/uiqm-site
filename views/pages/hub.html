    <script>
        function initMatrix() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = "0101010101010101";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = [];
            for (let i = 0; i < columns; i++) drops[i] = 1;
            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#0f0";
                ctx.font = fontSize + "px arial";
                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }

        if (savedColor) {
            document.documentElement.style.setProperty('--glow', savedColor);
            document.querySelectorAll('.color-swatch').forEach(s => {
                if(s.dataset.color === savedColor) {
                    document.querySelectorAll('.color-swatch').forEach(sw => sw.classList.remove('active'));
                    s.classList.add('active');
                }
            });
        }

        search.oninput = () => renderGames(search.value);

        // Add Friv's desktop games to the same catalog and use the same proxy
        // launch path as every other card. Keep the existing game order intact,
        // filter title duplicates, and spread additions through the grid.
        const normalizeGameTitle = title => (title || '')
            .normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');

        const normalizeGameUrl = value => {
            try {
                const url = new URL(value, location.href);
                if (!['http:', 'https:'].includes(url.protocol)) return '';
                const pathname = url.pathname;
                const rawPrefix = '/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor/refs/heads/master/';
                const cdnPrefix = '/gh/NoahsAmazingTutoringHelp/Noahs-Calculus-Tutor@master/';
                if (url.hostname === 'raw.githubusercontent.com' && pathname.startsWith(rawPrefix)) {
                    return `noahs-games:${pathname.slice(rawPrefix.length).toLowerCase()}${url.search}`;
                }
                if (url.hostname === 'cdn.jsdelivr.net' && pathname.startsWith(cdnPrefix)) {
                    return `noahs-games:${pathname.slice(cdnPrefix.length).toLowerCase()}${url.search}`;
                }
                url.hostname = url.hostname.toLowerCase();
                url.hash = '';
                return url.href.replace(/\/$/, '');
            } catch (_) {
                return '';
            }
        };

        const loadGameCatalogs = async () => {
            const sources = [
                { label: 'Friv', url: '/assets/json/friv-games.json' },
                { label: 'GSN', url: '/assets/json/gsn-games.json' }
            ];
            const results = await Promise.allSettled(sources.map(async source => {
                const response = await fetch(source.url, { cache: 'force-cache' });
                if (!response.ok) throw new Error(`${source.label} catalog request failed (${response.status}).`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error(`${source.label} catalog has an invalid format.`);
                return data;
            }));
            const additions = [];
            results.forEach((result, index) => {
                if (result.status === 'fulfilled') additions.push(...result.value);
                else console.warn(`${sources[index].label} games could not be added.`, result.reason);
            });

            const seenTitles = new Set();
            const seenUrls = new Set();
            const isUnique = game => {
                const titleKey = normalizeGameTitle(game?.title);
                const urlKey = game?.luminId
                    ? `lumin:${String(game.luminId).toLowerCase()}`
                    : normalizeGameUrl(game?.url);
                if (!titleKey || !urlKey || seenTitles.has(titleKey) || seenUrls.has(urlKey)) return false;
                seenTitles.add(titleKey);
                seenUrls.add(urlKey);
                return true;
            };

            const originalGames = games.filter(isUnique);
            const uniqueAdditions = additions.filter(isUnique);
            const mixedGames = [];
            let nextAddition = 0;
            originalGames.forEach((game, index) => {
                mixedGames.push(game);
                const targetCount = Math.floor(((index + 1) * uniqueAdditions.length) / originalGames.length);
                while (nextAddition < targetCount) mixedGames.push(uniqueAdditions[nextAddition++]);
            });
            while (nextAddition < uniqueAdditions.length) mixedGames.push(uniqueAdditions[nextAddition++]);

            games.splice(0, games.length, ...mixedGames);
            renderGames(search.value);
            console.info(`Games ready: ${games.length} unique titles (${uniqueAdditions.length} added from partner catalogs).`);
        };

        // Live users
        const updateUsers = () => {
            const count = Math.floor(Math.random() * (3 - 1) + 1);
            document.getElementById('user-count').innerText = count;
        };
        updateUsers(); setInterval(updateUsers, 10000);

        // Live clock
        function updateClock() {
            const el = document.getElementById('live-clock');
            if (!el) return;
            const now = new Date();
            el.innerText = now.toLocaleTimeString();
        }
        updateClock(); setInterval(updateClock, 1000);

        // Restore saved tab cloak from localStorage
        const savedTitle = localStorage.getItem('term-cloak-title');
        const savedIcon = localStorage.getItem('term-cloak-icon');
        if (savedTitle) document.title = savedTitle;
        if (savedIcon) {
            const l = document.querySelector("link[rel*='icon']") || document.createElement('link');
            l.type = 'image/x-icon'; l.rel = 'shortcut icon'; l.href = savedIcon;
            document.head.appendChild(l);
        }

        renderGames();
        loadGameCatalogs();
        window._proxyReady = initProxy();
    </script>
</body>
</html>
