<div class="settings-content">
  <div class="settings-header">
    <p class="cseltitle-main">Settings</p>
    <i class="far fa-times-circle close-settings-btn"></i>
  </div>
  <div class="settings-content-body">
    <div class="csel-container-left">
      <p class="cseltitle">Bro&#173;wse&#173;r Ta&#173;b Clo&shy;a&#8203;k</p>
      <form id="titleform" class="cloakform">
        <input
          type="text"
          placeholder="Enter a tab title here..."
          spellcheck="false"
        />
        <input type="submit" value="Apply" />
      </form>
      <form id="iconform" class="cloakform">
        <input
          type="text"
          placeholder="Enter an icon URL here..."
          spellcheck="false"
        />
        <input type="submit" value="Apply" />
      </form>
      <a href="/questions">Fi&#8203;nd I&shy;co&#8203;n U&shy;RL</a>
      <p class="cseltitle">W&#173;i&#173;s&shy;p Pro&#173;to&#8203;co&#173;l Tra&#8203;nspo&shy;rt</p>
      <div class="radio-group {{wst}}-list">
        <label>
          <p>
            Li&shy;bcu&#8203;rl
            <span class="default-badge"
              >Cro&#173;ss-Bro&#8203;wse&#173;r/Se&#8203;cu&shy;re (Fi&#173;re&#8203;fo&#8203;x)</span
            >
          </p>
          <input
            type="radio"
            name="{{wst}}"
            value="{{unix}}"
            checked
          />
        </label>
        <label>
          <p>
            E&#8203;po&#173;xy
            <span class="alt-badge"
              >Fa&#8203;ste&#173;st/Se&shy;cu&#8203;re (Chro&#173;mi&shy;u&shy;m, A&shy;pple&#8203;)</span
            >
          </p>
          <input type="radio" name="{{wst}}" value="{{epoch}}" />
        </label>
      </div>
      <p class="cseltitle">Advanced Options</p>
      <div class="radio-group">
        <label>
          <p>
            Hide Ads
            <span class="default-badge">La&shy;y&shy;e&#8203;re&shy;d A&#8203;dblo&#173;cki&#8203;ng</span>
          </p>
          <input type="checkbox" class="switch hideads" checked />
        </label>
        <label>
          <p>
            E&shy;na&shy;ble T&shy;o&#173;r/Rotate I&#173;P
            <span class="alt-badge">O&#173;n&#8203;i&#8203;o&shy;n Bro&#173;wse&#173;r Ro&shy;u&#173;ti&shy;ng</span>
          </p>
          <input type="checkbox" class="switch useonion" />
        </label>
        <label>
          <p>
            Enable Autocomplete
            <span class="default-badge">Pr&#8203;ox&#173;ie&#173;d Su&shy;gge&#8203;sti&#8203;o&#8203;ns</span>
          </p>
          <input type="checkbox" class="switch useac" checked />
        </label>
      </div>
    </div>
    <div class="settings-right-column">
      <p class="cseltitle">Search Engine</p>
      <select class="search-engine-list">
        <option>{{DuckDuckGo}}</option>
        <option>{{Bing}}</option>
        <option>{{Brave}}</option>
        <option>{{Startpage}}</option>
      </select>
      <p class="cseltitle">Select Theme</p>
      <div class="radio-group theme-list">
        <label>
          <p>Enable Default (Dark) Theme</p>
          <input type="radio" name="theme" value="dark" checked />
        </label>
        <label>
          <p>Enable Light Theme</p>
          <input type="radio" name="theme" value="light" />
        </label>
        <label>
          <p>Enable Nordish Theme</p>
          <input type="radio" name="theme" value="nord" checked />
        </label>
      </div>
      <p class="cseltitle">Icon Presets</p>
      <select id="icon-list">
        <option><!-- Leave this blank to avoid a bug. --></option>
        <option>{{Google}}</option>
        <option>{{Bing}}</option>
        <option>{{Google}} Drive</option>
        <option>Gmail</option>
      </select>
      <p class="cseltitle">Experimental Settings</p>
      <div class="radio-group">
        <label>
          <p>
            Re&#173;gi&shy;o&shy;n
            <span class="default-badge">Swa&shy;p P&#173;ro&#173;x&shy;y Re&shy;gi&#173;o&shy;n</span>
          </p>
          <select class="region-list">
            <option value="off">Off</option>
            <option value="eu">Sweden</option>
            <option value="jp">Japan</option>
          </select>
        </label>
      </div>
    </div>
  </div>
</div>
